<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Stok Takip Paneli</title>
<script>
  // Sayfanın kendisi (HTML/JS) tarayıcıda/CDN'de önbelleğe takılıp eski
  // kod gösterebiliyordu. Parametresiz her ziyarette benzersiz bir sürüm
  // sorgusuyla yeniden yönlendirip önbelleği zorla atlıyoruz. Telegram
  // Mini App kendi parametrelerini eklerse (location.search dolu gelirse)
  // dokunmuyoruz.
  if (!location.search) {
    location.replace(location.href + "?v=" + Date.now());
  }
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --accent: #0a84ff; --green: #30a14e; --red: #d1242f; --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #2c2c2e; --text: #f5f5f7; --muted: #98989d;
      --accent: #409cff; --green: #4cc38a; --red: #ff6369; --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; max-width: 640px;
    margin: 0 auto; line-height: 1.45;
  }
  h1 { font-size: 1.35rem; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .card .title { font-weight: 600; font-size: .95rem; }
  .card .meta { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .empty { border-style: dashed; color: var(--muted); }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  input[type=url], textarea {
    flex: 1 1 200px; padding: 10px 12px; border-radius: 10px; font-size: .9rem;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  textarea {
    width: 100%; margin-top: 10px; resize: vertical; font-family: inherit;
    line-height: 1.4;
  }
  button {
    padding: 10px 14px; border: none; border-radius: 10px; font-size: .9rem;
    font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--red); border: 1px solid var(--border); }
  button:active { opacity: .7; }
  .stock { margin-top: 8px; font-size: .82rem; }
  .stock b { color: var(--green); }
  .badge { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 20px;
           background: var(--bg); border: 1px solid var(--border); color: var(--muted); margin-left: 6px; }
  .badge-on { background: var(--green); border-color: var(--green); color: #fff; }
  .checkline { display: flex; align-items: center; gap: 8px; margin-top: 10px;
               font-size: .85rem; color: var(--muted); cursor: pointer; }
  .checkline input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px;
    font-size: .9rem; opacity: 0; transition: opacity .3s; pointer-events: none;
    max-width: 90%; text-align: center; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #err { color: var(--red); font-size: .9rem; margin: 20px 0; display: none; }
  details summary { cursor: pointer; color: var(--muted); font-size: .82rem; margin-top: 6px; }
  .loading { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<h1>🛍 Stok Takip Paneli</h1>
<p class="sub" id="subtitle">Zara + Mango · İşlem yaptığınızda komut kopyalanır → Telegram grubuna yapıştırıp gönderin. Bot ~5-10 sn içinde uygular, panel kendiliğinden güncellenir.</p>
<div id="err"></div>
<div id="app" class="loading">Yükleniyor…</div>
<div id="toast"></div>

<script>
const REPO = "SCengiz/TestZara";
// HİÇBİR kaynağın taze olduğuna güvenilemiyor — canlıda ikisi de yaşandı:
// bir gün raw.githubusercontent.com dakikalarca bayat veri döndü, ertesi
// gün api.github.com bayat kaldı (üstelik saatte 60 istekle de sınırlı).
// Bu yüzden "sırayla dene, ilk çalışanı al" yetmiyor; ilk cevap veren
// bayat olabiliyor.
//
// Çözüm: iki bağımsız CDN'den (ikisinin de sert istek sınırı yok) hem
// state hem watchlist paralel çekilir, state.last_check'e bakılıp EN TAZE
// olan kaynağın verisi kullanılır. Bot ikisini birlikte push ettiği için
// aynı kaynağın iki dosyası kendi içinde tutarlıdır.
const SOURCES = [
  { name: "raw", url: (p) => `https://raw.githubusercontent.com/${REPO}/main/${p}?t=${Date.now()}` },
  { name: "jsdelivr", url: (p) => `https://cdn.jsdelivr.net/gh/${REPO}@main/${p}?t=${Date.now()}` },
];

async function fetchFrom(src, path) {
  const r = await fetch(src.url(path), { cache: "no-store" });
  if (!r.ok) throw r.status;
  return r.json();
}

// Bir kaynaktan iki dosyayı birlikte çeker (tutarlı çift)
async function fetchPair(src) {
  const [watchlist, state] = await Promise.all([
    fetchFrom(src, "watchlist.json"),
    fetchFrom(src, "state.json").catch(() => ({})),
  ]);
  return { src: src.name, watchlist, state, stamp: state.last_check || "" };
}

// Tüm kaynakları dener, en taze last_check'e sahip olanı döndürür
async function fetchFreshest() {
  const results = await Promise.allSettled(SOURCES.map(fetchPair));
  const ok = results.filter(r => r.status === "fulfilled").map(r => r.value);
  if (!ok.length) {
    throw (results[0] && results[0].reason) || "tüm kaynaklar başarısız";
  }
  ok.sort((a, b) => (a.stamp < b.stamp ? 1 : a.stamp > b.stamp ? -1 : 0));
  return ok[0];
}
const AVAILABLE = ["in_stock", "low_on_stock"];
const MAX_SLOTS = 10;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (inTelegram) {
  tg.ready(); tg.expand();
  addEventListener("DOMContentLoaded", () => {
    document.getElementById("subtitle").textContent =
      "Zara + Mango · Düğmeye dokunun, işlem bota iletilir ve ~5-10 sn içinde uygulanır. Onaylar grup sohbetine düşer.";
  });
}

async function copyCmd(cmd, what) {
  if (inTelegram) {
    // Telegram içinde: işlemi doğrudan bota gönder (uygulama kapanır)
    tg.sendData(cmd);
    return;
  }
  try { await navigator.clipboard.writeText(cmd); }
  catch (e) { prompt("Kopyalayın:", cmd); return; }
  toast(`✅ ${what} komutu kopyalandı — şimdi Telegram grubuna yapıştırıp gönderin`);
}

function el(html) {
  const d = document.createElement("div"); d.innerHTML = html.trim();
  return d.firstChild;
}

function slotCard(n, wl, stateProducts) {
  if (!wl) {
    const c = el(`<div class="card empty">
      <div class="title">Liste ${n}: boş</div>
      <div class="row">
        <input type="url" placeholder="Zara favori listesi linkini yapıştırın">
        <button>Kaydet</button>
      </div></div>`);
    c.querySelector("button").onclick = () => {
      const v = c.querySelector("input").value.trim();
      if (!v.includes("share/wishlist")) return toast("⚠️ Geçerli bir 'listeyi paylaş' linki yapıştırın");
      copyCmd(`/zara_liste${n} ${v}`, `Liste ${n} kaydetme`);
    };
    return c;
  }
  const c = el(`<div class="card">
    <div class="title">Liste ${n}: ${wl.label || "Favori listesi"}</div>
    <div class="meta">ekleyen: ${wl.added_by || "?"} · ${wl.added_at || ""}</div>
    <div class="row">
      <input type="url" placeholder="Yeni link yapıştırın (güncellemek için)">
      <button>Güncelle</button>
      <button class="ghost">Boşalt</button>
    </div></div>`);
  const [upd, clr] = c.querySelectorAll("button");
  upd.onclick = () => {
    const v = c.querySelector("input").value.trim();
    if (!v.includes("share/wishlist")) return toast("⚠️ Önce yeni 'listeyi paylaş' linkini yapıştırın");
    copyCmd(`/zara_liste${n} ${v}`, `Liste ${n} güncelleme`);
  };
  clr.onclick = () => copyCmd(`/sil liste${n}`, `Liste ${n} boşaltma`);
  return c;
}

function productCard(i, p, stateProducts) {
  const store = (p.store || "zara").toUpperCase();
  const entry = p.key ? stateProducts[p.key] : Object.values(stateProducts)
    .find(e => e.url && p.url && e.url.split("v1=")[1] === p.url.split("v1=")[1]);
  let stockLine = "";
  if (entry) {
    const inStock = Object.entries(entry.sizes || {})
      .filter(([s, a]) => AVAILABLE.includes(a)).map(([s]) => s);
    stockLine = `<div class="stock">Stokta: ${inStock.length ? "<b>" + inStock.join(", ") + "</b>" : "—"}</div>`;
  }
  const allSizes = !!p.all_sizes;
  const sizeBadge = allSizes
    ? `<span class="badge badge-on">TÜM BEDENLER</span>` : "";
  const c = el(`<div class="card">
    <div class="title">${p.name || p.url}<span class="badge">${store}</span>${sizeBadge}</div>
    <div class="meta">ekleyen: ${p.added_by || "?"} · ${p.added_at || ""}</div>
    ${stockLine}
    <div class="row">
      <button class="ghost">${allSizes ? "Beden sınırını geri aç" : "Tüm bedenleri izle"}</button>
      <button class="ghost">Takipten çıkar</button>
    </div></div>`);
  const [toggle, del] = c.querySelectorAll("button");
  toggle.onclick = () => copyCmd(
    allSizes ? `/ekle ${p.url}` : `/ekle ${p.url} tum`,
    allSizes ? "Beden sınırını geri açma" : "Tüm bedenleri izleme");
  del.onclick = () => copyCmd(`/sil ${i}`, "Ürün silme");
  return c;
}

let refreshing = false;

async function main() {
  // Kullanıcı bir şey doldurmuşsa (link yazmış veya kutucuk işaretlemiş)
  // o turu atla — yenilenme yarım kalmış girişi silmesin. Sonraki turda
  // tekrar dener.
  const busy = [...document.querySelectorAll("input, textarea")].some(
    el => el.type === "checkbox" ? el.checked : el.value.trim());
  if (busy) return;
  if (refreshing) return;
  refreshing = true;
  const app = document.getElementById("app");
  let watchlist, state, srcName;
  try {
    const best = await fetchFreshest();
    watchlist = best.watchlist;
    state = best.state;
    srcName = best.src;
    document.getElementById("err").style.display = "none";
  } catch (e) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent =
      "⏳ Veri şu an okunamadı, panel otomatik tekrar deniyor (" + e + ")";
    // app.textContent'i temizlemiyoruz — ekrandaki son geçerli veri
    // görünmeye devam etsin, boş ekrana düşülmesin.
    refreshing = false;
    return;
  }
  app.classList.remove("loading");
  app.textContent = "";
  const sp = state.products || {};

  app.appendChild(el(`<h2>📋 Favori listeleri (10 yuva)</h2>`));
  const slots = {};
  (watchlist.wishlists || []).forEach(w => { if (w.slot) slots[w.slot] = w; });
  for (let n = 1; n <= MAX_SLOTS; n++) app.appendChild(slotCard(n, slots[n], sp));

  app.appendChild(el(`<h2>👕 Tekil ürünler</h2>`));
  const prods = watchlist.products || [];
  if (prods.length) prods.forEach((p, i) => app.appendChild(productCard(i + 1, p, sp)));
  else app.appendChild(el(`<div class="card empty"><div class="title">Tekil ürün yok</div></div>`));

  const add = el(`<div class="card">
    <div class="title">➕ Ürün ekle (Zara veya Mango)</div>
    <textarea id="addlinks" rows="3"
      placeholder="Ürün linklerini yapıştırın — birden fazlaysa her satıra bir tane"></textarea>
    <div class="meta" id="linkcount">Henüz link yok</div>
    <label class="checkline">
      <input type="checkbox" id="allsizes">
      <span>Beden sınırı olmasın — tüm bedenler bildirilsin</span>
    </label>
    <div class="row"><button>Ekle</button></div></div>`);

  const ta = add.querySelector("#addlinks");
  const counter = add.querySelector("#linkcount");
  const linksOf = (t) => (t.match(/https?:\/\/[^\s]+/g) || [])
    .filter(u => /zara\.com|mango\.com/.test(u));
  ta.addEventListener("input", () => {
    const n = linksOf(ta.value).length;
    counter.textContent = n ? `${n} ürün linki algılandı` : "Henüz link yok";
  });
  add.querySelector("button").onclick = () => {
    const links = linksOf(ta.value);
    if (!links.length) return toast("⚠️ Zara veya Mango ürün linki yapıştırın");
    const all = add.querySelector("#allsizes").checked;
    const cmd = `/ekle ${links.join(" ")}${all ? " tum" : ""}`;
    if (cmd.length > 3900) {
      return toast("⚠️ Çok fazla link — Telegram mesaj sınırını aşar, birkaç parçaya bölün");
    }
    if (links.length > 15) {
      toast(`ℹ️ ${links.length} ürün sırayla işlenecek, biraz sürebilir`);
    }
    copyCmd(cmd, `${links.length} ürün ekleme${all ? " (tüm bedenler)" : ""}`);
  };
  app.appendChild(add);

  const now = new Date().toLocaleTimeString("tr-TR");
  app.appendChild(el(`<details><summary>Son kontrol: ${state.last_check || "?"} ·
    ${Object.keys(sp).length} ürün-renk kaydı izleniyor · panel ${now} itibarıyla güncel</summary>
    <p class="meta" style="margin-top:8px">Liste/ürün ekleme-silme komutları bota ulaştıktan
    sonra ~5-10 saniyede işlenir; panel kendiliğinden ~45 sn'de bir yenilenip
    bunu yansıtır (elle yenilemenize gerek yok). Stok taraması ayrı bir
    ritimde, birkaç dakikada bir yapılır.<br>
    Veri kaynağı: <b>${srcName}</b> (iki CDN paralel denenip en tazesi seçilir).
    </p></details>`));
  refreshing = false;
}
main();
setInterval(main, 45000);
</script>
</body>
</html>
